name: Docker Image CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  python-build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 QEMU
      # GitHub ubuntu-latest 默认通常是 amd64，
      # 构建 arm64 镜像需要 QEMU 支持
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # 3. 初始化 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录阿里云 ACR
      - name: Login to Aliyun ACR
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          echo -n "$ACR_PASSWORD" | \
          docker login "$ACR_REGISTRY" \
            -u "$ACR_USERNAME" \
            --password-stdin

      # 5. 构建 ARM64 Python 基础镜像并推送到 ACR
      - name: Build and push ARM64 Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile

          # 强制构建 ARM64
          platforms: linux/arm64

          # 推送到阿里云 ACR
          push: true

          tags: |
            ${{ secrets.ACR_REGISTRY }}/dkzx_test/python:3.12.7-slim-bookworm-arm64

          # 不生成额外 provenance manifest
          provenance: false

          # 不生成 SBOM
          sbom: false

          # 这次建议禁用旧缓存，防止之前错误架构缓存继续被使用
          no-cache: true